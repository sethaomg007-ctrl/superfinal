<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/src/output.css" />
    <title>ABOUT OUR FOOD</title>
  </head>

  <body class="bg-[#f5eee8] dark:bg-gray-900 transition-colors duration-300">

    <!--sticky srolling nav-->

      <div class="sticky top-0 z-50 bg-amber-50 dark:bg-gray-900">

        <!-- nav bar -->
    <div
      class="  px-10 py-4 flex items-center justify-between shadow-sm ">
      <div class="text-3xl font-bold">
        <span class="text-orange-400">Phum</span>
        <span class="text-black dark:text-amber-50">Yeung</span>
      </div>

      <div class="flex items-center gap-6 ">
      <nav
        class="flex flex-wrap gap-4 text-xl font-semibold text-[rgb(105,55,39)] px-6 md:px-10 py-4">
        <a href="/index.html" class="text-orange-400 hover:text-[rgb(254,169,84)] transition">Home</a>
        <a href="/menu.html" class=" text-orange-400 hover:text-[rgb(254,169,84)] transition">Menu</a>
        <a href="/about.html" class="text-orange-400 hover:text-[rgb(254,169,84)] transition">About</a>
        <a href="/service.html" class="text-orange-400 hover:text-[rgb(254,169,84)] transition">Services</a>
        <a href="/contact.html" class="text-orange-400 hover:text-[rgb(254,169,84)] transition">Contact</a>
        
      </nav>

      <button
        id="theme-toggle"
        class="ml-5 mr-1 mt-auto p-3 border border-orange-400 rounded-full bg-black dark:bg-white transition duration-300"
      >
        <!-- SUN ICON -->

        <svg
          id="sun-icon"
          xmlns="http://www.w3.org/2000/svg"
          class="w-5 h-5 text-orange-400"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
        >
          <circle cx="12" cy="12" r="5" />
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"
          />
        </svg>

        <!-- MOON ICON -->

        <svg
          id="moon-icon"
          xmlns="http://www.w3.org/2000/svg"
          class="w-5 h-5 text-white hidden"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M21 12.79A9 9 0 1111.21 3 
        7 7 0 0021 12.79z"
          />
        </svg>
      </button>
    </div>
    </div>
      </div>


    

    <!-- ✅ CONTACT FORM -->
    <div class="max-w-4xl mx-auto px-10 py-16 ">
      <h2 class="text-3xl font-bold text-center mb-8 text-gray-900 dark:text-white">
        Contact Us
      </h2>

      <form id="contact-form"
        action="https://formspree.io/f/xxxxabcd"
        method="POST"
        class="grid gap-6">

        <input type="text" name="name" placeholder="Your Name" required class="p-3 rounded border dark:text-amber-50 dark:bg-gray-800" />

        <input type="email" name="email" placeholder="Your Email" required class="p-3 rounded border dark:text-amber-50 dark:bg-gray-800" />

        <textarea name="message" placeholder="Your Message" required rows="5"
          class="p-3 rounded border dark:text-amber-50 dark:bg-gray-800"></textarea>

        <input type="hidden" name="_subject" value="New Contact Message" />

        <button type="submit"
          class="bg-orange-400 text-white py-3 rounded hover:bg-orange-500">
          Send Message
        </button>
      </form>

      <p id="status" class="text-center mt-4"></p>
    </div>

    <!-- footer -->
    <footer class="bg-black text-gray-300 px-10 py-12 mt-90">
      <div class="max-w-6xl mx-auto grid md:grid-cols-3 gap-10">

        <div>
          <h2 class="text-xl font-bold mb-4">
            <span class="text-orange-400">Phum</span> Yeung
          </h2>
        </div>

        <div>
          <h3 class="text-white font-semibold mb-4">Quick Links</h3>
        </div>

        <!-- ✅ CONTACT -->
        <div>
          <h3 class="text-white font-semibold mb-4">Contact</h3>
           <p class="text-sm mb-2">📍 Phnom Penh, Cambodia</p>

          <p class="text-sm mb-2">
            📞 <a href="tel:+85512345678" class="hover:text-orange-400">
              +855 12 345 678
            </a>
          </p>

          <p class="text-sm mb-4">
            ✉️ <a href="mailto:info@phumyeung.com" class="hover:text-orange-400">
              info@phumyeung.com
            </a>
          </p>
        </div>
      </div>

      <div class="text-center text-sm text-gray-500 mt-10 border-t border-gray-700 pt-6">
        © 2026 Phum Yeung. All rights reserved.
      </div>
    </footer>

    <!-- scripts -->
    <script>
      const toggleBtn = document.getElementById("theme-toggle");
      const html = document.documentElement;
      const sunIcon = document.getElementById("sun-icon");
      const moonIcon = document.getElementById("moon-icon");

      toggleBtn.addEventListener("click", () => {
        html.classList.toggle("dark");
        sunIcon.classList.toggle("hidden");
        moonIcon.classList.toggle("hidden");
      });

      
    </script>

  </body>
</html>
